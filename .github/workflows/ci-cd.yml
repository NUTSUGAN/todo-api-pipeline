name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22.14.0'
  TAG: ${{ github.sha }}
  DOCKER_IMAGE_NAMESPACE: ${{ vars.DOCKER_IMAGE_NAMESPACE || secrets.DOCKERHUB_USERNAME || 'nutsugan' }}

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: todo
      PGPASSWORD: todo_pw
      PGDATABASE: todo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'
    outputs:
      published: ${{ steps.publish-context.outputs.push }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Decide whether images can be published
        id: publish-context
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to Docker Hub
        if: steps.publish-context.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build todo-api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.publish-context.outputs.push == 'true' }}
          tags: ${{ env.DOCKER_IMAGE_NAMESPACE }}/todo-api:${{ env.TAG }}
      - name: Build stats-api
        uses: docker/build-push-action@v6
        with:
          context: ./stats_api
          push: ${{ steps.publish-context.outputs.push == 'true' }}
          tags: ${{ env.DOCKER_IMAGE_NAMESPACE }}/stats-api:${{ env.TAG }}

  deploy:
    name: Deploy production
    runs-on: self-hosted
    needs: [build]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.published == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Load SSH key in memory
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust target host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy production files
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p /srv/todo/grafana/provisioning/datasources /srv/todo/grafana/provisioning/dashboards /srv/todo/grafana/dashboards"
          scp -P "${{ secrets.DEPLOY_PORT }}" deploy/compose.yml "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/compose.yml"
          scp -P "${{ secrets.DEPLOY_PORT }}" deploy/prometheus.yml "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/prometheus.yml"
          scp -P "${{ secrets.DEPLOY_PORT }}" deploy/alerts.yml "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/alerts.yml"
          scp -P "${{ secrets.DEPLOY_PORT }}" deploy/grafana/provisioning/datasources/prometheus.yml "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/grafana/provisioning/datasources/prometheus.yml"
          scp -P "${{ secrets.DEPLOY_PORT }}" deploy/grafana/provisioning/dashboards/dashboards.yml "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/grafana/provisioning/dashboards/dashboards.yml"
          scp -P "${{ secrets.DEPLOY_PORT }}" deploy/grafana/dashboards/todo-api-overview.json "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/grafana/dashboards/todo-api-overview.json"
      - name: Start target stack
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cd /srv/todo && DOCKER_IMAGE_NAMESPACE='${{ env.DOCKER_IMAGE_NAMESPACE }}' TAG='${{ env.TAG }}' docker compose -f compose.yml pull && DOCKER_IMAGE_NAMESPACE='${{ env.DOCKER_IMAGE_NAMESPACE }}' TAG='${{ env.TAG }}' docker compose -f compose.yml up -d --remove-orphans"
      - name: Verify health endpoint
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "curl -fsS http://localhost:3000/health"
